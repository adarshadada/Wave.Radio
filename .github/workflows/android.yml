name: Build Android app
on:
  workflow_dispatch:
  push:
    paths: ['android-app/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check the Firebase secret
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "Add the GOOGLE_SERVICES_JSON secret first (see android-app/README.md)"; exit 1; fi
      - run: npm install
      - run: npx cap add android
      - name: Firebase file, permissions and icon
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GSJ" > android/app/google-services.json
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          if command -v convert >/dev/null && [ -f ../assets/icon-512.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              for f in ic_launcher ic_launcher_round; do
                convert ../assets/icon-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
              done
            done
          fi
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: wave.radio app ${{ github.run_number }}
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
